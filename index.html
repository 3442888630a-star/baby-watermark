<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>宝宝成长水印</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f7f1e5; color: #3d3831; padding: 18px 16px 48px; }
  .hero { background: linear-gradient(135deg, #f7e8cd, #f2dcb4 60%, #ecd3a4); border-radius: 18px; padding: 22px 20px 18px; box-shadow: 0 8px 22px rgba(160,120,50,.16); }
  h1 { font-size: 23px; color: #4a3a22; letter-spacing: 1px; }
  .sub { color: #8a7350; font-size: 13px; margin-top: 7px; line-height: 1.6; }
  .card { background: #fff; border-radius: 16px; padding: 16px 18px; margin-top: 14px; box-shadow: 0 6px 18px rgba(160,120,50,.08); }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; font-size: 15px; }
  .row label { font-weight: 600; }
  input[type="date"] { font-size: 15px; color: #b3813c; border: none; background: transparent; text-align: right; font-family: inherit; }
  .note { font-size: 12px; color: #9a917f; }
  #ageLine { display: none; margin-top: 10px; background: #faf3e6; border-radius: 10px; padding: 10px 12px; font-size: 14px; color: #6b6257; }
  #ageLine b { color: #b3813c; }
  #pick { display: block; width: 100%; height: 190px; margin-top: 14px; border: 2px dashed #d8cbb4; border-radius: 16px; background: #fffdf8; color: #3d3831; font-size: 17px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 18px rgba(160,120,50,.07); }
  #pick .plus { font-size: 34px; color: #c9a86a; display: block; margin-bottom: 6px; }
  #pick small { display: block; margin-top: 8px; font-weight: 400; font-size: 12px; color: #9a917f; }
  #cvWrap { display: none; margin-top: 14px; border-radius: 16px; overflow: hidden; background: #eee7da; box-shadow: 0 10px 26px rgba(90,70,40,.18); }
  canvas { display: block; width: 100%; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .chip { flex: 0 0 auto; padding: 9px 17px; border-radius: 999px; background: #f3ecdf; color: #6b6257; font-size: 14px; border: none; cursor: pointer; }
  .chip.on { background: #b3813c; color: #fff; font-weight: 600; box-shadow: 0 4px 12px rgba(179,129,60,.35); }
  .divider { height: 1px; background: #f1e9da; margin: 14px 0 6px; }
  input[type="range"] { width: 100%; accent-color: #b3813c; margin: 6px 0 4px; }
  .val { color: #b3813c; font-weight: 600; font-size: 14px; }
  .swatches { display: flex; gap: 12px; align-items: center; padding: 6px 0 4px; flex-wrap: wrap; }
  .sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(0,0,0,.10); cursor: pointer; padding: 0; }
  .sw.on { border: 3px solid #b3813c; transform: scale(1.14); }
  .custom { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6b6257; }
  input[type="color"] { width: 34px; height: 34px; border: none; background: none; padding: 0; cursor: pointer; }
  .switch { position: relative; width: 48px; height: 28px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; }
  .track { position: absolute; inset: 0; background: #ddd2bf; border-radius: 999px; transition: .2s; pointer-events: none; }
  .track::after { content: ''; position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #fff; top: 3px; left: 3px; transition: .2s; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .switch input:checked + .track { background: #b3813c; }
  .switch input:checked + .track::after { left: 23px; }
  .btns { display: none; gap: 10px; margin-top: 16px; }
  .btns button { flex: 1; padding: 14px 0; border-radius: 999px; font-size: 16px; cursor: pointer; }
  #again { background: #fff; border: 1px solid #ddd2bf; color: #6b6257; }
  #save { background: #b3813c; border: none; color: #fff; font-weight: 600; box-shadow: 0 8px 20px rgba(179,129,60,.35); }
  #resultBox { display: none; margin-top: 18px; text-align: center; }
  #resultBox .hint { font-size: 15px; font-weight: 600; color: #b3813c; margin-bottom: 10px; }
  #resultBox img { width: 100%; border-radius: 16px; box-shadow: 0 10px 26px rgba(90,70,40,.2); }
  .tips { margin-top: 20px; font-size: 12px; line-height: 1.8; color: #a29885; }
</style>
</head>
<body>
<div class="hero">
  <h1>宝宝成长水印</h1>
  <p class="sub">选照片、填出生日期，自动按拍摄时间算出宝宝多大，盖上好看的水印。字号、颜色、天数都能自己调。</p>
</div>

<input type="file" id="file" accept="image/*" hidden>
<button id="pick"><span class="plus">＋</span>选择宝宝照片<small>从相册选一张</small></button>
<div id="cvWrap"><canvas id="cv"></canvas></div>

<div class="card">
  <div class="row"><label>宝宝出生日期</label><input type="date" id="birth"></div>
  <div class="row"><label>照片日期</label><input type="date" id="photoDate"></div>
  <div class="note" id="dateNote">照片日期会自动读照片的拍摄时间，读不到时用今天，也可以手动改。</div>
  <div id="ageLine"></div>
</div>

<div class="card" id="styleCard" style="display:none">
  <div class="row"><label>水印样式</label></div>
  <div class="chips" id="chips"></div>
  <div class="divider"></div>
  <div class="row"><label>文字大小</label><span class="val" id="scaleVal">100%</span></div>
  <input type="range" id="scale" min="60" max="160" step="5" value="100">
  <div class="row"><label>文字颜色</label></div>
  <div class="swatches" id="swatches"></div>
  <div class="row"><label>显示累计天数</label>
    <span class="switch"><input type="checkbox" id="showDays"><span class="track"></span></span>
  </div>
</div>

<div class="btns" id="btns">
  <button id="again">换一张</button>
  <button id="save">生成成品图</button>
</div>

<div id="resultBox">
  <div class="hint">成品图好了，长按图片就能保存到相册</div>
  <img id="resultImg" alt="加好水印的照片">
</div>

<p class="tips">小提示：如果照片是微信转发来的，拍摄时间可能已被抹掉，那就手动改一下照片日期。生成的是原图分辨率，和原图一样清楚。</p>

<script>
// ---------- 年龄计算 ----------
function parseDateStr(s){const p=String(s).split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1);}
function toDateStr(d){const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return d.getFullYear()+'-'+m+'-'+day;}
function fmtDate(d){const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return d.getFullYear()+'.'+m+'.'+day;}
function addMonths(date,n){const d=new Date(date.getFullYear(),date.getMonth(),1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(date.getDate(),last));return d;}
function calcAge(birth,photo){const b=new Date(birth.getFullYear(),birth.getMonth(),birth.getDate());const p=new Date(photo.getFullYear(),photo.getMonth(),photo.getDate());const totalDays=Math.round((p-b)/86400000);if(totalDays<0)return{valid:false,totalDays};let mt=(p.getFullYear()-b.getFullYear())*12+(p.getMonth()-b.getMonth());if(addMonths(b,mt)>p)mt-=1;const after=addMonths(b,mt);const days=Math.round((p-after)/86400000);return{valid:true,years:Math.floor(mt/12),months:mt%12,days,totalDays};}
function ageMainText(age){if(!age||!age.valid)return '';if(age.totalDays===0)return '出生第一天';const mt=age.years*12+age.months;if(mt===0)return age.days+'天';return mt+'个月'+age.days+'天';}

// ---------- EXIF 拍摄时间 ----------
function parseExifDate(buf){try{const dv=new DataView(buf);if(dv.byteLength<4||dv.getUint16(0)!==0xffd8)return null;let off=2;while(off<dv.byteLength-4){const marker=dv.getUint16(off);if((marker&0xff00)!==0xff00)break;const size=dv.getUint16(off+2);if(marker===0xffe1&&dv.getUint32(off+4)===0x45786966)return readTiff(dv,off+10);off+=2+size;}return null;}catch(e){return null;}}
function readTiff(dv,t0){const little=dv.getUint16(t0)===0x4949;const g16=o=>dv.getUint16(t0+o,little);const g32=o=>dv.getUint32(t0+o,little);function findTag(ifd,tag){const n=g16(ifd);for(let i=0;i<n;i++){const e=ifd+2+i*12;if(g16(e)===tag)return e;}return -1;}function asciiVal(e){if(g16(e+2)!==2)return null;const cnt=g32(e+4);const base=cnt<=4?e+8:g32(e+8);let s='';for(let i=0;i<cnt-1;i++)s+=String.fromCharCode(dv.getUint8(t0+base+i));return s;}
const ifd0=g32(4);let ds=null;const ptr=findTag(ifd0,0x8769);if(ptr>=0){const ex=g32(ptr+8);const dto=findTag(ex,0x9003);if(dto>=0)ds=asciiVal(dto);}if(!ds){const dt=findTag(ifd0,0x0132);if(dt>=0)ds=asciiVal(dt);}if(!ds)return null;const m=ds.match(/(\d{4}):(\d{2}):(\d{2})/);if(!m)return null;return new Date(+m[1],+m[2]-1,+m[3]);}

// ---------- 水印绘制（与小程序版相同逻辑） ----------
const FONT='"STKaiti","KaiTi","Kaiti SC","Songti SC",serif';
function setFont(ctx,size,weight){ctx.font=(weight?weight+' ':'')+size+'px '+FONT;}
function luminance(hex){const n=parseInt(String(hex).slice(1),16);if(isNaN(n))return 1;const r=(n>>16)&255,g=(n>>8)&255,b=n&255;return (0.299*r+0.587*g+0.114*b)/255;}
function shadowFor(ctx,color,blur){ctx.shadowColor=luminance(color)<0.35?'rgba(255,255,255,0.55)':'rgba(0,0,0,0.45)';ctx.shadowBlur=blur;ctx.shadowOffsetY=blur*0.25;}
function shadowOff(ctx){ctx.shadowColor='rgba(0,0,0,0)';ctx.shadowBlur=0;ctx.shadowOffsetY=0;}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const drawFns={
  classic(ctx,W,H,d){const s=d.scale,color=d.color;const x=W*0.075;const ms=W*0.062*s;const ds2=W*0.033*s;const daysSize=W*0.027*s;let dateBase;
    if(d.showDays){const daysBase=H-W*0.048;dateBase=daysBase-daysSize*1.55;ctx.fillStyle=color;ctx.globalAlpha=0.92;ctx.textAlign='left';ctx.textBaseline='alphabetic';shadowFor(ctx,color,W*0.007);setFont(ctx,daysSize);ctx.fillText('第 '+d.totalDays+' 天',x,daysBase);ctx.globalAlpha=1;}
    else{dateBase=H-W*0.055;}
    const lineY=dateBase-ds2*1.55;ctx.fillStyle=color;ctx.textAlign='left';ctx.textBaseline='alphabetic';shadowFor(ctx,color,W*0.008);setFont(ctx,ms);ctx.fillText(d.mainText,x,lineY-W*0.016);const tw=ctx.measureText(d.mainText).width;ctx.fillRect(x,lineY,tw,Math.max(2,W*0.0038*s));setFont(ctx,ds2);ctx.fillText(d.dateText,x,dateBase);shadowOff(ctx);},
  minimal(ctx,W,H,d){const color=d.color;ctx.fillStyle=color;ctx.textAlign='right';ctx.textBaseline='alphabetic';shadowFor(ctx,color,W*0.007);setFont(ctx,W*0.032*d.scale);let text=d.mainText+'  ·  '+d.dateText;if(d.showDays)text+='  ·  第'+d.totalDays+'天';ctx.fillText(text,W*0.95,H-W*0.048);shadowOff(ctx);},
  badge(ctx,W,H,d){const color=d.color,s=d.scale;const cx=W*0.862,cy=W*0.155,r=W*0.104;ctx.save();ctx.translate(cx,cy);ctx.rotate(-0.13);ctx.strokeStyle=color;ctx.fillStyle=color;shadowFor(ctx,color,W*0.006);ctx.lineWidth=W*0.0058;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();ctx.lineWidth=W*0.0022;ctx.beginPath();ctx.arc(0,0,r*0.84,0,Math.PI*2);ctx.stroke();ctx.textAlign='center';ctx.textBaseline='middle';let size=r*0.5*s;setFont(ctx,size,'bold');while(ctx.measureText(d.mainText).width>r*1.45&&size>r*0.18){size*=0.9;setFont(ctx,size,'bold');}ctx.fillText(d.mainText,0,d.showDays?-r*0.24:-r*0.16);setFont(ctx,r*0.27*s);ctx.fillText(d.dateText,0,d.showDays?r*0.22:r*0.38);if(d.showDays){setFont(ctx,r*0.2*s);ctx.fillText('第'+d.totalDays+'天',0,r*0.58);}ctx.restore();shadowOff(ctx);},
  film(ctx,W,H,d){const barH=Math.max(H*0.085,W*0.11);ctx.fillStyle='rgba(12,12,12,0.55)';ctx.fillRect(0,H-barH,W,barH);ctx.fillStyle=d.color;ctx.textBaseline='middle';const size=barH*0.4*d.scale;setFont(ctx,size);ctx.textAlign='left';ctx.fillText(d.dateText,W*0.05,H-barH/2);ctx.textAlign='right';ctx.fillText(d.mainText,W*0.95,H-barH/2);if(d.showDays){ctx.textAlign='center';ctx.globalAlpha=0.85;setFont(ctx,size*0.82);ctx.fillText('第 '+d.totalDays+' 天',W/2,H-barH/2);ctx.globalAlpha=1;}},
  pill(ctx,W,H,d){const size=W*0.034*d.scale;setFont(ctx,size);const text='第 '+d.totalDays+' 天 · '+d.mainText;const tw=ctx.measureText(text).width;const padX=size*0.85,padY=size*0.5;const w=tw+padX*2,h=size+padY*2;const x=W*0.05,y=W*0.045;const lightText=luminance(d.color)>0.8;ctx.save();ctx.shadowColor='rgba(0,0,0,0.25)';ctx.shadowBlur=W*0.01;ctx.shadowOffsetY=W*0.003;ctx.fillStyle=lightText?'rgba(30,26,22,0.55)':'rgba(255,255,255,0.92)';roundRect(ctx,x,y,w,h,h/2);ctx.fill();ctx.restore();ctx.fillStyle=lightText?d.color:(d.color==='#ffffff'?'#4a4239':d.color);ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(text,x+padX,y+h/2+size*0.04);},
  polaroid(ctx,W,H,d){const stripH=H-d.stripTop;const color=d.color==='#ffffff'?'#3d3831':d.color;ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';setFont(ctx,W*0.048*d.scale);ctx.fillText(d.mainText,W/2,d.stripTop+stripH*0.36);ctx.fillStyle='#9a917f';setFont(ctx,W*0.03*d.scale);let text=d.dateText;if(d.showDays)text+='  ·  第'+d.totalDays+'天';ctx.fillText(text,W/2,d.stripTop+stripH*0.68);}
};
const STYLES=[['classic','经典款'],['minimal','极简款'],['badge','印章款'],['film','胶片款'],['pill','天数贴'],['polaroid','拍立得']];
const COLORS=[['#ffffff','奶白'],['#f7e7c3','奶油'],['#d9a441','暖金'],['#f2b8c6','浅粉'],['#9db38f','豆绿'],['#6b4a2f','深棕'],['#2b2620','墨黑']];

// ---------- 页面逻辑 ----------
const $=id=>document.getElementById(id);
let img=null, styleId='classic', color='#ffffff';
const MAX_EDGE=Infinity; // 不缩放原图

STYLES.forEach(([id,name])=>{const b=document.createElement('button');b.className='chip'+(id===styleId?' on':'');b.textContent=name;b.onclick=()=>{styleId=id;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');hideResult();redraw();};$('chips').appendChild(b);});
COLORS.forEach(([v,n])=>{const b=document.createElement('button');b.className='sw'+(v===color?' on':'');b.style.background=v;b.title=n;b.onclick=()=>{color=v;document.querySelectorAll('.sw').forEach(c=>c.classList.remove('on'));b.classList.add('on');$('customColor').value=v;hideResult();redraw();};$('swatches').appendChild(b);});
const customWrap=document.createElement('span');customWrap.className='custom';customWrap.innerHTML='自定义 <input type="color" id="customColor" value="#ffffff">';
$('swatches').appendChild(customWrap);
$('customColor').addEventListener('input',e=>{color=e.target.value;document.querySelectorAll('.sw').forEach(c=>c.classList.remove('on'));hideResult();redraw();});

const saved=JSON.parse(localStorage.getItem('wmSettings')||'{}');
if(saved.scale){$('scale').value=saved.scale;$('scaleVal').textContent=saved.scale+'%';}
if(saved.showDays===true)$('showDays').checked=true;
const savedBirth=localStorage.getItem('babyBirth');
if(savedBirth) $('birth').value=savedBirth;
function persist(){localStorage.setItem('wmSettings',JSON.stringify({scale:+$('scale').value,showDays:$('showDays').checked}));}
$('birth').addEventListener('change',()=>{localStorage.setItem('babyBirth',$('birth').value);hideResult();redraw();});
$('photoDate').addEventListener('change',()=>{$('dateNote').textContent='手动设置的照片日期';hideResult();redraw();});
$('scale').addEventListener('input',()=>{$('scaleVal').textContent=$('scale').value+'%';persist();hideResult();redraw();});
$('showDays').addEventListener('change',()=>{persist();hideResult();redraw();});
$('pick').onclick=()=>$('file').click();
$('again').onclick=()=>$('file').click();
$('file').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{const buf=await f.arrayBuffer();const d=parseExifDate(buf);if(d){$('photoDate').value=toDateStr(d);$('dateNote').textContent='已自动读取照片的拍摄时间';}else{$('photoDate').value=toDateStr(new Date());$('dateNote').textContent='没读到拍摄时间，先用今天，可手动改';}}catch(err){$('photoDate').value=toDateStr(new Date());}
  const url=URL.createObjectURL(f); const im=new Image();
  im.onload=()=>{img=im;$('pick').style.display='none';$('cvWrap').style.display='block';$('styleCard').style.display='block';$('btns').style.display='flex';hideResult();redraw();};
  im.src=url;
});

function currentAge(){
  const birthStr=$('birth').value, pdStr=$('photoDate').value;
  if(!birthStr) return {err:'先选一下宝宝的出生日期 👆'};
  const age=calcAge(parseDateStr(birthStr),parseDateStr(pdStr));
  if(!age.valid) return {err:'照片日期比出生日期还早，检查一下两个日期'};
  return {age, mainText:ageMainText(age), dateText:fmtDate(parseDateStr(pdStr))};
}
function settings(){return {scale:+$('scale').value/100, color:color, showDays:$('showDays').checked};}

function redraw(){
  if(!img) return;
  const r=currentAge();
  $('ageLine').style.display='block';
  if(r.err){$('ageLine').textContent=r.err;drawOnly(null);return;}
  $('ageLine').innerHTML='宝宝这天 <b>'+r.mainText+'</b> 啦 · 来到世界第 '+r.age.totalDays+' 天';
  drawOnly({mainText:r.mainText,dateText:r.dateText,totalDays:r.age.totalDays,...settings()});
}

function drawOnly(d){
  const cv=$('cv'),ctx=cv.getContext('2d');
  const w=img.naturalWidth,h=img.naturalHeight;
  const k=Math.min(1,MAX_EDGE/Math.max(w,h));
  let cw=Math.round(w*k),ch=Math.round(h*k),px=0,py=0,stripTop=0;
  if(styleId==='polaroid'&&d){const side=Math.round(cw*0.06);const bottom=Math.round(cw*0.26);px=side;py=side;stripTop=side+ch;cw+=side*2;ch+=side+bottom;}
  cv.width=cw;cv.height=ch;
  if(styleId==='polaroid'&&d){ctx.fillStyle='#fffdf8';ctx.fillRect(0,0,cw,ch);}
  ctx.drawImage(img,px,py,Math.round(w*k),Math.round(h*k));
  if(d) drawFns[styleId](ctx,cw,ch,{...d,stripTop});
}

function hideResult(){$('resultBox').style.display='none';}

$('save').onclick=()=>{
  if(!img) return;
  const r=currentAge();
  if(r.err){alert(r.err);return;}
  redraw();
  const url=$('cv').toDataURL('image/jpeg',1.0);
  // 手机上最稳的保存方式：把成品图显示出来长按保存；同时尝试直接下载（电脑浏览器有效）
  $('resultImg').src=url;
  $('resultBox').style.display='block';
  try{const a=document.createElement('a');a.download='宝宝水印-'+($('photoDate').value||'photo')+'.jpg';a.href=url;a.click();}catch(e){}
  setTimeout(()=>$('resultBox').scrollIntoView({behavior:'smooth',block:'center'}),80);
};
</script>
</body>
</html>
